function normalizeType(v){ var t=s(v).trim().toLowerCase(); return ["poster","posters","mau poster","mẫu poster"].includes(t)?"poster":"powerpoint"; }
function formatDate(v){ if(!v) return ""; var str=s(v).trim(); if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) return str; var d=new Date(str); if(!isNaN(d)&&d.getFullYear()>2000) return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); return str; }
function parseItem(item,fallback){ if(Array.isArray(item)) return {ten:s(item[0]),mota:s(item[1]),ngay:formatDate(s(item[2])),anh:s(item[3]),loai:normalizeType(item[4]||fallback)}; return {ten:s(item&&item.ten),mota:s(item&&item.mota),ngay:formatDate(s(item&&(item.ngaycapnhat||item.gia))),anh:s(item&&item.anh),loai:normalizeType(item&&item.loai||fallback)}; }
function parseImgs(anh){ return s(anh).split(";").map(function(x){return x.trim();}).filter(Boolean).filter(isUrl); }
function withTs(url){ return url+(url.includes("?")?"&regions":"?")+"t="+Date.now(); }

async function fetchJ(url,ms){ ms=ms||12000; var ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort();},ms); try{ var r=await fetch(url,{cache:"no-store",signal:ctrl.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }finally{ clearTimeout(t); } }

function bootText(txt){ var e=$("bootText"); if(e) e.textContent=txt; }
function hideBoot(){ var pl=$("preLoad"); if(!pl) return; pl.style.transition="opacity .45s ease"; pl.style.opacity="0"; setTimeout(function(){ pl.remove(); },480); }
async function finishBoot(){ var elapsed=performance.now()-bootStart; if(elapsed<BOOT_MIN) await wait(BOOT_MIN-elapsed); hideBoot(); }

function filtered(){ var q=s($("searchQ").value).trim().toLowerCase(); return allItems.map(function(sp,i){return {sp:sp,i:i};}).filter(function(x){return normalizeType(x.sp.loai)===activeType;}).filter(function(x){return !q||(s(x.sp.ten)+" "+s(x.sp.mota)).toLowerCase().includes(q);}).map(function(x);return x.i; }); }

function renderGrid(){
  var grid=$("grid"); if(!grid) return;
  grid.innerHTML="";
  var idxs=filtered(), label=activeType==="poster"?"Poster":"PowerPoint";
  $("catalogTitle").textContent="Mẫu "+label;
  $("countStat").textContent=allItems.filter(function(x){return normalizeType(x.loai)===activeType;}).length;
  if(!idxs.length){grid.innerHTML='<div class="empty-state"><h3>Không có dữ liệu</h3><p>Chưa có mẫu nào.</p></div>';return;}
  
  var frag=document.createDocumentFragment();

    var sp=allItems[i]||{}, imgs=parseImgs(sp.anh), src=imgs[0]||"https://via.placeholder.com/900x600?text=No+Image";

    card.addEventListener("click",function(){openModal(i);});

  });
  grid.appendChild(frag);

function setModal(open){ var m=$("modal"); m.classList.toggle("open",open); document.body.style.overflow=open?"hidden":""; }
function updateModalImg(){ var img=$("mainImg"); img.src=modalImgs[modalIdx]||""; }
function renderThumbs(){ var box=$("thumbs"); box.innerHTML=""; modalImgs.forEach(function(url,idx){var im=document.createElement("img");im.src=url;if(idx===modalIdx) im.classList.add("active");im.addEventListener("click",function(){modalIdx=idx;updateModalImg();renderThumbs();});box.appendChild(im);}); }
function openModal(i){ var sp=allItems[i]||{}; modalImgs=parseImgs(sp.anh); if(!modalImgs.length) modalImgs=["https://via.placeholder.com/1200x800?text=No+Image"]; modalIdx=0; $("mTitle").textContent=s(sp.ten); $("mDesc").textContent=s(sp.mota); updateModalImg(); renderThumbs(); setModal(true); }

function parseRes(r){ return (Array.isArray(r)?r:[]).map(function(i){return {ten:s(i.ten||i[0]),mota:s(i.mota||i[1]),ngay:formatDate(s(i.ngay||i[2])),anh:s(i.anh||i[3]),link:s(i.link||i[4])};}).filter(function(x){return x.ten||x.anh;}); }
async function loadRes(){
  try{ resItems=parseRes(await fetchJ(withTs(API_RESOURCE))); }catch(e){}
}

async function fetchItems(){
  var results=await Promise.allSettled([fetchJ(withTs(API_PPT)),fetchJ(withTs(API_POSTER))]);
  var pR=results[0], poR=results[1];
  var ppt=(pR.status==="fulfilled"?pR.value:[]).map(function(i){return parseItem(i,"powerpoint");}).filter(function(x){return x.ten||x.anh;});
  var post=(poR.status==="fulfilled"?poR.value:[]).map(function(i){return parseItem(i,"poster");}).filter(function(x){return x.ten||x.anh;});
  return {items:ppt.concat(post), complete:(pR.status==="fulfilled"&&poR.status==="fulfilled")};
}

async function load(){
  setPill("loading");
  try{
    var r=await fetchItems();
    allItems=r.items;
    setPill("ok");
    renderGrid();
  }catch(err){
    setPill("err");
  }
  await finishBoot();
}

function isSensitiveContent(text){

  if(!raw) return BOT_FALLBACK;
  var norm = botNormalize(raw);
  for(var i=0; i<BOT_KB.length; i++){
    var item = BOT_KB[i];
    for(var j=0; j<item.kws.length; j++){
      if(norm.indexOf(botNormalize(item.kws[j])) !== -1) return item.a;
    }
  }
  return BOT_FALLBACK;
}

async function loadBotKB(){
  try{
    var data = await fetchJ(withTs(API_BOT));
    if(!Array.isArray(data)) return;
    BOT_KB = data.map(function(item){
      var kwRaw = s(Array.isArray(item)?item[0]:(item.tukhoa||item.TuKhoa));
      var ans = s(Array.isArray(item)?item[1]:(item.traloi||item.TraLoi));
      return {kws: kwRaw.split(/[;,]/).map(function(k){return k.trim();}).filter(Boolean), a: ans};
    }).filter(function(x){return x.kws.length && x.a;});
  }catch(e){}
}

function botAddMsg(text, who){
  var body = $("botBody"); if(!body) return;
  var div = document.createElement("div");
  div.className = "bot-msg " + (who==="user"?"user":"bot");
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function checkUserIpBlocked(){
  try {
    var blockInfo = localStorage.getItem("tp_ip_blocked_until");
    if(blockInfo && Date.now() < parseInt(blockInfo, 10)) return true;
  } catch(e) {}
  return false;
}

function triggerBlock24h(){
  var blockTime = Date.now() + (24 * 60 * 60 * 1000);
  localStorage.setItem("tp_ip_blocked_until", blockTime);
  var input = $("botInput"), send = $("botSend");
  if(input) { input.disabled = true; input.placeholder = "Đã bị tạm khóa."; }
  if(send) send.disabled = true;
  botAddMsg("Hệ thống tạm thời hạn chế quyền truy cập của bạn do vi phạm tiêu chuẩn cộng đồng. Vui lòng quay lại sau 24 giờ.", "bot");
}

function botReply(userText){
  botAddMsg(userText, "user");
  if(checkUserIpBlocked()){ triggerBlock24h(); return; }
  if(isSensitiveContent(userText)){ triggerBlock24h(); return; }

  setTimeout(function(){
    botAddMsg(botFindAnswer(userText), "bot");
  }, 400);
}

function initBot(){
  var fab = $("botFab"), panel = $("botPanel"), close = $("botClose"), input = $("botInput"), send = $("botSend");
  if(!fab || !panel) return;
  var greeted = false;

  loadBotKB();
  if(checkUserIpBlocked()){ triggerBlock24h(); }

  fab.addEventListener("click", function(){
    panel.classList.add("open");
    if(!greeted){ greeted=true; botAddMsg(BOT_GREETING, "bot"); }
    if(input && !input.disabled) input.focus();
  });
  close.addEventListener("click", function(){ panel.classList.remove("open"); });

  function submitInput(){
    var v = s(input.value).trim();
    if(!v || input.disabled) return;
    input.value = "";
    botReply(v);
  }

  send.addEventListener("click", submitInput);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") submitInput(); });
}

function bindEvents(){
  $("searchQ").addEventListener("input", debounce(renderGrid, 180));
  $("btnClose").addEventListener("click", function(){ setModal(false); });
  $("modal").addEventListener("click", function(e){ if(e.target.id==="modal") setModal(false); });
  document.querySelectorAll(".type-btn").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".type-btn").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      activeType = b.dataset.type || "powerpoint";
      renderGrid();
    });
  });
  document.querySelectorAll("[data-nav]").forEach(function(a){
    a.addEventListener("click", function(){
      activeType = a.dataset.nav || "powerpoint";
      document.querySelectorAll("[data-nav]").forEach(function(x){x.classList.remove("active");});
      a.classList.add("active");
      renderGrid();
    });
  });
  $("btnNoticeDetail").addEventListener("click", function(){
    modalImgs = ["https://i.ibb.co/8ggMsXsC/7-E619879-EE83-4994-9-D37-F9728665-D324.png"];
    modalIdx = 0;
    $("mTitle").textContent = "Thông báo mới nhất";
    $("mDesc").textContent = "Cập nhật mẫu mới từ TP DESIGN.";
    updateModalImg();
    renderThumbs();
    setModal(true);
  });
}

buildHTML();
bindEvents();
load().then(function(){ initWelcome(); });
loadRes();
initBot();

})();
</script>
