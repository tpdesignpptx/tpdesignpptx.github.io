async function fetchJ(url){
  var r = await fetch(url, {cache: "no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}
function withTs(url){ return url + (url.includes("?")?"&":"?") + "t=" + Date.now(); }

function normalizeType(v){ var t=s(v).trim().toLowerCase(); return ["poster","posters","mau poster","mẫu poster"].includes(t)?"poster":"powerpoint"; }
function parseItem(item,fallback){ if(Array.isArray(item)) return {ten:s(item[0]),mota:s(item[1]),ngay:s(item[2]),anh:s(item[3]),loai:normalizeType(item[4]||fallback)}; return {ten:s(item&&item.ten),mota:s(item&&item.mota),ngay:s(item&&(item.ngaycapnhat||item.gia)),anh:s(item&&item.anh),loai:normalizeType(item&&item.loai||fallback)}; }
function parseImgs(anh){ return s(anh).split(";").map(function(x){return x.trim();}).filter(Boolean).filter(isUrl); }

function filtered(){ 
  var q = s($("searchQ").value).trim().toLowerCase(); 
  return allItems.map(function(sp,i){return {sp:sp,i:i};}).filter(function(x){return normalizeType(x.sp.loai)===activeType;}).filter(function(x){return !q||(s(x.sp.ten)+" "+s(x.sp.mota)).toLowerCase().includes(q);}).map(function(x){return x.i;}); 
}

function renderGrid(){
  var grid = $("grid"); if(!grid) return;
  grid.innerHTML="";
  var idxs = filtered(), label = activeType==="poster"?"Poster":"PowerPoint";
  $("catalogTitle").textContent = "Mẫu " + label;
  if(!idxs.length){ grid.innerHTML = '<div class="empty-state"><h3>Không có dữ liệu</h3><p>Chưa có mẫu nào trong danh mục này.</p></div>'; return; }
  
  var frag = document.createDocumentFragment();
  idxs.forEach(function(i){
    var sp = allItems[i]||{}, imgs = parseImgs(sp.anh), src = imgs[0]||"https://via.placeholder.com/900x600?text=No+Image";
    var card = document.createElement("article");
    card.className = "card";
    card.innerHTML = '<div class="card-img"><img src="'+src+'" alt="'+s(sp.ten)+'" loading="lazy"></div><div class="card-body"><div class="card-title">'+s(sp.ten)+'</div><div class="card-desc">'+s(sp.mota)+'</div></div>';
    card.addEventListener("click", function(){ openModal(i); });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function setModal(open){ var m = $("modal"); m.classList.toggle("open", open); }
function openModal(i){
  var sp = allItems[i]||{};
  var imgs = parseImgs(sp.anh);
  $("mainImg").src = imgs[0] || "";
  $("mTitle").textContent = s(sp.ten);
  $("mDesc").textContent = s(sp.mota);
  setModal(true);
}

async function loadData(){
  try{
    var results = await Promise.allSettled([fetchJ(withTs(API_PPT)), fetchJ(withTs(API_POSTER))]);
    var pR = results[0], poR = results[1];
    var ppt = (pR.status==="fulfilled"?pR.value:[]).map(function(i){return parseItem(i,"powerpoint");}).filter(function(x){return x.ten||x.anh;});
    var post = (poR.status==="fulfilled"?poR.value:[]).map(function(i){return parseItem(i,"poster");}).filter(function(x){return x.ten||x.anh;});
    allItems = ppt.concat(post);
    renderGrid();
  }catch(err){
    $("grid").innerHTML = '<div class="empty-state"><h3>Không tải được dữ liệu</h3><p>'+s(err.message)+'</p></div>';
  }finally{
    var pl = $("preLoad"); if(pl) pl.remove();
  }
}

function botNormalize(text){
  return s(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function isSensitiveContent(text){
  var lower = botNormalize(text);
  var sensitiveKeywords = ["dm", "dcm", "vcl", "vl", "cc", "cl", "vãi", "cứt", "địt", "đụ", "cu", "lồn", "cặc", "chó", "ngu", "sex", "dam", "18+", "chinh tri"];
  for(var i=0; i<sensitiveKeywords.length; i++){
    if(lower.indexOf(sensitiveKeywords[i]) !== -1) return true;
  }
  return false;
}

function botFindAnswer(text){
  var raw = s(text).trim();
  if(!raw) return BOT_FALLBACK;
  var norm = botNormalize(raw);
  for(var i=0; i<BOT_KB.length; i++){
    var item = BOT_KB[i];
    for(var j=0; j<item.kws.length; j++){
      if(norm.indexOf(botNormalize(item.kws[j])) !== -1) return item.a;
    }
  }
  return BOT_FALLBACK;
}

async function loadBotKB(){
  try{
    var data = await fetchJ(withTs(API_BOT));
    if(!Array.isArray(data)) return;
    BOT_KB = data.map(function(item){
      var kwRaw = s(Array.isArray(item)?item[0]:(item.tukhoa||item.TuKhoa));
      var ans = s(Array.isArray(item)?item[1]:(item.traloi||item.TraLoi));
      return {kws: kwRaw.split(/[;,]/).map(function(k){return k.trim();}).filter(Boolean), a: ans};
    }).filter(function(x){return x.kws.length && x.a;});
  }catch(e){}
}

function botAddMsg(text, who){
  var body = $("botBody"); if(!body) return;
  var div = document.createElement("div");
  div.className = "bot-msg " + (who==="user"?"user":"bot");
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function checkUserIpBlocked(){
  try {
    var blockInfo = localStorage.getItem("tp_ip_blocked_until");
    if(blockInfo && Date.now() < parseInt(blockInfo, 10)) return true;
  } catch(e) {}
  return false;
}

function triggerBlock24h(){
  var blockTime = Date.now() + (24 * 60 * 60 * 1000);
  localStorage.setItem("tp_ip_blocked_until", blockTime);
  var input = $("botInput"), send = $("botSend");
  if(input) { input.disabled = true; input.placeholder = "Đã bị tạm khóa."; }
  if(send) send.disabled = true;
  botAddMsg("Hệ thống tạm thời hạn chế quyền truy cập của bạn do vi phạm tiêu chuẩn cộng đồng. Vui lòng quay lại sau 24 giờ.", "bot");
}

function botReply(userText){
  botAddMsg(userText, "user");
  if(checkUserIpBlocked()){ triggerBlock24h(); return; }
  if(isSensitiveContent(userText)){ triggerBlock24h(); return; }

  setTimeout(function(){
    botAddMsg(botFindAnswer(userText), "bot");
  }, 400);
}

function initBot(){
  var fab = $("botFab"), panel = $("botPanel"), close = $("botClose"), input = $("botInput"), send = $("botSend");
  if(!fab || !panel) return;
  var greeted = false;

  loadBotKB();
  if(checkUserIpBlocked()){ triggerBlock24h(); }

  fab.addEventListener("click", function(){
    panel.classList.add("open");
    if(!greeted){ greeted=true; botAddMsg(BOT_GREETING, "bot"); }
    if(input && !input.disabled) input.focus();
  });
  close.addEventListener("click", function(){ panel.classList.remove("open"); });

  function submitInput(){
    var v = s(input.value).trim();
    if(!v || input.disabled) return;
    input.value = "";
    botReply(v);
  }

  send.addEventListener("click", submitInput);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") submitInput(); });
}

function bindEvents(){
  $("searchQ").addEventListener("input", debounce(renderGrid, 180));
  $("btnClose").addEventListener("click", function(){ setModal(false); });
  $("modal").addEventListener("click", function(e){ if(e.target.id==="modal") setModal(false); });
  document.querySelectorAll(".type-btn").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".type-btn").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      activeType = b.dataset.type || "powerpoint";
      renderGrid();
    });
  });
}

buildHTML();
bindEvents();
loadData();
initBot();

})();
</script>
