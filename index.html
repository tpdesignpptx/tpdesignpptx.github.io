async function fetchJ(url){
  var r = await fetch(url, {cache: "no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}
function withTs(url){ return url + (url.includes("?")?"&":"?") + "t=" + Date.now(); }

var BOT_GREETING = "Xin chào! 😊 Mình là trợ lý ảo, mình có thể giúp gì cho bạn nè? ✨";
var BOT_FALLBACK = "Mình chưa tìm thấy câu trả lời phù hợp 🤔. Bạn thử nhập câu hỏi gần giống hoặc ngắn gọn hơn nhé!";
var BOT_KB = [];

function botNormalize(text){
  return s(text).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isSensitiveContent(text){
  var lower = botNormalize(text);
  var sensitiveKeywords = [
    "dm", "dcm", "vcl", "vl", "cc", "cl", "vãi", "cứt", "địt", "đụ", "cu", "lồn", "cặc", "chó", "ngu",
    "sex", "dam", "18+", "khieu dam", "loa the", "khêu gợi", "goi duc", "quan he", "thu dam",
    "chinh tri", "dang", "bau cu", "bieu tinh", "phan dong", "cach mang", "nha nuoc", "chinh phu"
  ];
  for(var i=0; i<sensitiveKeywords.length; i++){
    if(lower.indexOf(sensitiveKeywords[i]) !== -1) return true;
  }
  return false;
}

function botFindAnswer(text){
  var raw = s(text).trim();
  if(!raw) return BOT_FALLBACK;
  var norm = botNormalize(raw);
  for(var i=0; i<BOT_KB.length; i++){
    var item = BOT_KB[i];
    for(var j=0; j<item.kws.length; j++){
      if(norm.indexOf(botNormalize(item.kws[j])) !== -1) return item.a;
    }
  }
  return BOT_FALLBACK;
}

async function loadBotKB(){
  try{
    var data = await fetchJ(withTs(API_BOT));
    if(!Array.isArray(data)) return false;
    BOT_KB = data.map(function(item){
      var kwRaw = s(Array.isArray(item)?item[0]:(item.tukhoa||item.TuKhoa));
      var ans = s(Array.isArray(item)?item[1]:(item.traloi||item.TraLoi));
      return {kws: kwRaw.split(/[;,]/).map(function(k){return k.trim();}).filter(Boolean), a: ans};
    }).filter(function(x){return x.kws.length && x.a;});
    return true;
  }catch(e){ return false; }
}

function botAddMsg(text, who){
  var body = $("botBody"); if(!body) return;
  var div = document.createElement("div");
  div.className = "bot-msg " + (who==="user"?"user":"bot");
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function botAddTyping(){
  var body = $("botBody"); if(!body) return null;
  var div = document.createElement("div");
  div.className = "bot-typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

async function checkUserIpBlocked(){
  try {
    var blockInfo = localStorage.getItem("tp_ip_blocked_until");
    if(blockInfo && Date.now() < parseInt(blockInfo, 10)){
      return true;
    }
  } catch(e) {}
  return false;
}

function triggerBlock24h(){
  var blockTime = Date.now() + (24 * 60 * 60 * 1000); // 24 giờ
  localStorage.setItem("tp_ip_blocked_until", blockTime);
  
  var input = $("botInput"), send = $("botSend");
  if(input) { input.disabled = true; input.placeholder = "Đã bị tạm khóa."; }
  if(send) send.disabled = true;
  
  // Thông báo chặn chuyên nghiệp hơn
  botAddMsg("Hệ thống tạm thời hạn chế quyền truy cập của bạn do vi phạm tiêu chuẩn cộng đồng. Vui lòng quay lại sau 24 giờ.", "bot");
}

function botReply(userText){
  botAddMsg(userText, "user");
  
  checkUserIpBlocked().then(function(isBlocked){
    if(isBlocked){
      triggerBlock24h();
      return;
    }

    if(isSensitiveContent(userText)){
      triggerBlock24h();
      return;
    }

    var typing = botAddTyping();
    setTimeout(function(){
      if(typing && typing.parentNode) typing.parentNode.removeChild(typing);
      botAddMsg(botFindAnswer(userText), "bot");
    }, 400);
  });
}

function initBot(){
  var fab = $("botFab"), panel = $("botPanel"), close = $("botClose"), input = $("botInput"), send = $("botSend");
  if(!fab || !panel) return;
  var greeted = false;

  loadBotKB();
  
  checkUserIpBlocked().then(function(isBlocked){
    if(isBlocked){
      triggerBlock24h();
    }
  });

  function openPanel(){
    panel.classList.add("open");
    if(!greeted){ greeted=true; botAddMsg(BOT_GREETING, "bot"); }
    setTimeout(function(){ if(input && !input.disabled) input.focus(); }, 200);
  }
  function closePanel(){ panel.classList.remove("open"); }

  fab.addEventListener("click", openPanel);
  close.addEventListener("click", closePanel);

  function submitInput(){
    var v = s(input.value).trim();
    if(!v || input.disabled) return;
    input.value = "";
    botReply(v);
  }

  send.addEventListener("click", submitInput);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") submitInput(); });
}

buildHTML();
initBot();

})();
</script>
</body>
