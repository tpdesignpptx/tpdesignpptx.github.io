'.site-header{position:sticky;top:0;z-index:100;background:rgba(6,8,24,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}.brand{display:flex;align-items:center;gap:11px}.brand-logo{width:40px;height:40px;border-radius:12px;object-fit:cover;border:1px solid var(--border2);background:#fff;flex-shrink:0}.brand-name{font-size:16px;font-weight:800;color:var(--text);line-height:1.2}.brand-sub{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}',

'.hero{padding:50px 0 30px}.hero-h1{font-size:clamp(30px,4vw,48px);font-weight:800;line-height:1.15;letter-spacing:-.5px;color:var(--text);margin-bottom:14px}.hero-h1 .grad{background:linear-gradient(135deg,#a78bfa,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}.hero-sub{font-size:14.5px;color:var(--muted);line-height:1.65;max-width:48ch}',

'.empty-state h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}',
'.foot{border-top:1px solid var(--border);background:rgba(0,0,0,.2);padding:30px 0 20px;font-size:13px;color:var(--muted);text-align:center}',

'.modal-box{width:min(900px,100%);border-radius:var(--r2);background:#0d1230;border:1px solid var(--border2);box-shadow:var(--shadow);overflow:hidden}',

'.close-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer}',
'.modal-body{padding:16px}',
'.modal-img-wrap{border-radius:12px;overflow:hidden;background:var(--bg2)}',
'.modal-img-wrap img{width:100%;max-height:55vh;object-fit:contain;display:block}',

'.thumbs img{width:64px;height:46px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer}',
'.bot-fab{position:fixed;right:20px;bottom:20px;z-index:150;width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:linear-gradient(135deg,#6d5bff,#00d4ff);box-shadow:0 8px 24px rgba(109,91,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}',
'.bot-fab img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}',
'.bot-panel{position:fixed;right:20px;bottom:88px;z-index:151;width:min(340px,calc(100vw - 28px));max-height:480px;display:flex;flex-direction:column;border-radius:var(--r2);overflow:hidden;background:#0d1230;border:1px solid var(--border2);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(12px) scale(.97);transition:all .2s ease}',
'.bot-panel.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}',
'.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}',
'.bot-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:340px}',

'.bot-msg.bot{align-self:flex-start;background:rgba(255,255,255,.07);color:var(--text)}',
'.bot-msg.user{align-self:flex-end;background:linear-gradient(135deg,#6d5bff,#00d4ff);color:#fff}',

'.bot-input-wrap input{flex:1;border:0;outline:none;background:#060818;border-radius:999px;padding:8px 12px;font-size:12px;color:var(--text);font-family:var(--font)}',
'.bot-send{width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;background:#6d5bff;color:#fff;display:grid;place-items:center}'
].join("\n");
document.head.appendChild(style);

function buildHTML(){
  var root = document.getElementById("__app_root");
  root.innerHTML = [
    '<div class="bg-canvas" aria-hidden="true"><div class="bg-orb bg-orb1"></div><div class="bg-orb bg-orb2"></div></div>',
    '<header class="site-header"><div class="wrap header-inner"><a class="brand" href="#top"><img class="brand-logo" src="https://i.ibb.co/mC7tWqp7/F0-B32-A25-E4-D7-4-AAF-85-D0-A13-B80037851.png" alt="Logo"><div><div class="brand-name">TP DESIGN PPTX</div><div class="brand-sub">Slide xịn · Học đỉnh</div></div></a><nav class="nav"><a href="#kho" data-nav="powerpoint" class="active">PowerPoint</a><a href="#kho" data-nav="poster">Poster</a><a href="#tai-nguyen">Tài nguyên</a></nav></div></header>',
    '<main id="top">',
    '<section class="wrap hero"><h1 class="hero-h1">Kho mẫu <span class="grad">PowerPoint</span> & Poster</h1><p class="hero-sub">Trang trưng bày mẫu thiết kế tham khảo miễn phí cho học sinh, sinh viên và giáo viên.</p></section>',
    '<section class="wrap" id="kho"><div class="catalog-header"><div class="catalog-title-block"><h2 id="catalogTitle">Mẫu PowerPoint</h2></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="type-switch" id="typeSwitch"><div class="type-pill-bg" id="typePillBg"></div><button class="type-btn active" data-type="powerpoint">PowerPoint</button><button class="type-btn" data-type="poster">Poster</button></div><label class="search-wrap"><input id="searchQ" type="search" placeholder="Tìm mẫu…"></label><button class="reload-btn" id="btnReload">↻ Làm mới</button></div></div><div class="grid" id="grid"></div></section>',
    '<section class="wrap" id="tai-nguyen" style="padding-bottom:40px"><div class="catalog-header"><div class="catalog-title-block"><h2>Tài nguyên miễn phí</h2></div></div><div class="grid" id="resGrid"></div></section>',
    '</main>',
    '<footer class="foot"><div class="wrap">© ' + new Date().getFullYear() + ' TP DESIGN PPTX · Mọi quyền được bảo lưu</div></footer>',
    '<button class="bot-fab" id="botFab"><img src="' + BOT_AVATAR_SVG + '" alt="Chat"></button>',
    '<div class="bot-panel" id="botPanel"><div class="bot-head"><strong>Trợ lý TP DESIGN</strong><button class="close-btn" id="botClose">✕</button></div><div class="bot-body" id="botBody"></div><div class="bot-input-wrap"><input id="botInput" type="text" placeholder="Nhập câu hỏi…"><button class="bot-send" id="botSend">➤</button></div></div>',
    '<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><strong id="mTitle">Chi tiết</strong><button class="close-btn" id="btnClose">✕</button></div><div class="modal-body"><div class="modal-img-wrap"><img id="mainImg" alt=""></div><p id="mDesc" style="margin-top:10px;font-size:13px;color:var(--muted)"></p><div class="thumbs" id="thumbs"></div></div></div></div>'
  ].join("");
}

function normalizeType(v){ var t=s(v).trim().toLowerCase(); return ["poster","posters","mau poster","mẫu poster"].includes(t)?"poster":"powerpoint"; }
function parseItem(item,fallback){ if(Array.isArray(item)) return {ten:s(item[0]),mota:s(item[1]),anh:s(item[3]),loai:normalizeType(item[4]||fallback)}; return {ten:s(item&&item.ten),mota:s(item&&item.mota),anh:s(item&&item.anh),loai:normalizeType(item&&item.loai||fallback)}; }
function parseImgs(anh){ return s(anh).split(";").map(function(x){return x.trim();}).filter(Boolean).filter(isUrl); }

async function fetchJ(url){
  try{
    var r = await fetch(url, {cache: "no-store"});
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}

function hideBoot(){ var pl=$("preLoad"); if(pl) pl.remove(); }

function filtered(){
  var q = s($("searchQ").value).trim().toLowerCase();
  return allItems.map(function(sp,i){return {sp:sp,i:i};})
    .filter(function(x){return normalizeType(x.sp.loai)===activeType;})
    .filter(function(x){return !q||(s(x.sp.ten)+" "+s(x.sp.mota)).toLowerCase().includes(q);})
    .map(function(x){return x.i;});
}

function renderGrid(){
  var grid = $("grid"); if(!grid) return;
  grid.innerHTML = "";
  var idxs = filtered(), label = activeType==="poster"?"Poster":"PowerPoint";
  $("catalogTitle").textContent = "Mẫu " + label;
  if(!idxs.length){ grid.innerHTML = '<div class="empty-state"><h3>Không có dữ liệu</h3><p>Chưa có mẫu nào trong danh mục này.</p></div>'; return; }
  
  var frag = document.createDocumentFragment();
  idxs.forEach(function(i){
    var sp = allItems[i]||{}, imgs = parseImgs(sp.anh), src = imgs[0]||"https://via.placeholder.com/900x600?text=No+Image";
    var card = document.createElement("article");
    card.className = "card";
    card.innerHTML = '<div class="card-img"><img src="'+src+'" alt="'+s(sp.ten)+'" loading="lazy"></div><div class="card-body"><div class="card-title">'+s(sp.ten)+'</div><div class="card-desc">'+s(sp.mota)+'</div></div>';
    card.addEventListener("click", function(){ openModal(i); });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function renderResGrid(){
  var grid = $("resGrid"); if(!grid) return;
  grid.innerHTML = "";
  if(!resItems.length){ grid.innerHTML = '<div class="empty-state"><p>Đang cập nhật tài nguyên miễn phí...</p></div>'; return; }
  var frag = document.createDocumentFragment();
  resItems.forEach(function(sp){
    var imgs = parseImgs(sp.anh), src = imgs[0]||"https://via.placeholder.com/900x600?text=No+Image";
    var card = document.createElement("article");
    card.className = "card";
    card.innerHTML = '<div class="card-img"><img src="'+src+'" alt="" loading="lazy"></div><div class="card-body"><div class="card-title">'+s(sp.ten||sp[0])+'</div><div class="card-desc">'+s(sp.mota||sp[1])+'</div>'+(sp.link||sp[4]?'<a href="'+s(sp.link||sp[4])+'" target="_blank" rel="noopener" style="margin-top:8px;font-size:12px;color:var(--accent2);font-weight:700">Tải về miễn phí →</a>':'')+'</div>';
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function openModal(i){
  var sp = allItems[i]||{};
  modalImgs = parseImgs(sp.anh);
  if(!modalImgs.length) modalImgs = ["https://via.placeholder.com/1200x800?text=No+Image"];
  modalIdx = 0;
  $("mTitle").textContent = s(sp.ten);
  $("mDesc").textContent = s(sp.mota);
  $("mainImg").src = modalImgs[0];
  var thumbs = $("thumbs"); thumbs.innerHTML = "";
  modalImgs.forEach(function(url, idx){
    var im = document.createElement("img"); im.src = url;
    im.addEventListener("click", function(){ modalIdx=idx; $("mainImg").src=url; });
    thumbs.appendChild(im);
  });
  $("modal").classList.add("open");
}

function initTypeSwitch(){
  var sw = $("typeSwitch"); if(!sw) return;
  function updateType(type){
    activeType = type;
    if(type === "poster") sw.classList.add("poster-active");
    else sw.classList.remove("poster-active");
    document.querySelectorAll(".type-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.type === type);
    });
    renderGrid();
  }
  document.querySelectorAll(".type-btn").forEach(function(b){
    b.addEventListener("click", function(){ updateType(b.dataset.type); });
  });
}

async function loadData(){
  try {
    var cached = localStorage.getItem("tp_cache_v2");
    if(cached){
      var parsed = JSON.parse(cached);
      allItems = parsed.items || [];
      resItems = parsed.res || [];
      renderGrid();
      renderResGrid();
      hideBoot();
    }
  } catch(e){}

  var results = await Promise.all([fetchJ(API_PPT), fetchJ(API_POSTER), fetchJ(API_RESOURCE)]);
  var ppt = (results[0]||[]).map(function(i){ return parseItem(i, "powerpoint"); }).filter(function(x){ return x.ten||x.anh; });
  var post = (results[1]||[]).map(function(i){ return parseItem(i, "poster"); }).filter(function(x){ return x.ten||x.anh; });
  resItems = results[2]||[];
  allItems = ppt.concat(post);

  try {
    localStorage.setItem("tp_cache_v2", JSON.stringify({items: allItems, res: resItems}));
  } catch(e){}

  renderGrid();
  renderResGrid();
  hideBoot();
}

function bindEvents(){
  $("searchQ").addEventListener("input", renderGrid);
  $("btnReload").addEventListener("click", loadData);
  $("btnClose").addEventListener("click", function(){ $("modal").classList.remove("open"); });
  $("modal").addEventListener("click", function(e){ if(e.target.id==="modal") $("modal").classList.remove("open"); });

  var fab=$("botFab"), panel=$("botPanel"), close=$("botClose"), input=$("botInput"), send=$("botSend"), body=$("botBody");
  if(fab && panel){
    fab.addEventListener("click", function(){
      panel.classList.toggle("open");
      if(body.children.length === 0){
        var d = document.createElement("div"); d.className = "bot-msg bot"; d.textContent = "Xin chào! Mình có thể giúp gì cho bạn? 😊";
        body.appendChild(d);
      }
    });
    close.addEventListener("click", function(){ panel.classList.remove("open"); });
    function sendMsg(){
      var v = s(input.value).trim(); if(!v) return;
      input.value = "";
      var u = document.createElement("div"); u.className = "bot-msg user"; u.textContent = v; body.appendChild(u);
      body.scrollTop = body.scrollHeight;
      setTimeout(function(){
        var b = document.createElement("div"); b.className = "bot-msg bot"; b.textContent = "Bạn có thể xem trực tiếp các mẫu trên kho hoặc liên hệ Zalo 0773181186 để được hỗ trợ file nhé!";
        body.appendChild(b); body.scrollTop = body.scrollHeight;
      }, 400);
    }
    send.addEventListener("click", sendMsg);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") sendMsg(); });
  }

  document.querySelectorAll("[data-nav]").forEach(function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      var type = a.dataset.nav;
      if(type==="powerpoint"||type==="poster"){
        activeType = type;
        var sw = $("typeSwitch");
        if(sw) { if(type==="poster") sw.classList.add("poster-active"); else sw.classList.remove("poster-active"); }
        document.querySelectorAll(".type-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.type===type); });
        renderGrid();
        window.scrollTo({top: $("kho").offsetTop - 60, behavior: "smooth"});
      } else if(type==="tai-nguyen"){
        window.scrollTo({top: $("tai-nguyen").offsetTop - 60, behavior: "smooth"});
      }
    });
  });
}

buildHTML();
initTypeSwitch();
bindEvents();
loadData();

})();
</script>
</body>
</html>
