}

function setModal(open){ var m=$("modal");m.classList.toggle("open",open);document.body.style.overflow=open?"hidden":""; }
function updateModalImg(){ var img=$("mainImg");img.src=modalImgs[modalIdx]||""; }
function renderThumbs(){ var box=$("thumbs");box.innerHTML="";modalImgs.forEach(function(url,idx){var im=document.createElement("img");im.src=url;if(idx===modalIdx) im.style.borderColor="var(--accent2)";im.addEventListener("click",function(){modalIdx=idx;updateModalImg();renderThumbs();});box.appendChild(im);}); }
function openModal(i){ var sp=allItems[i]||{};modalImgs=parseImgs(sp.anh);if(!modalImgs.length) modalImgs=["https://via.placeholder.com/1200x800?text=No+Image"];modalIdx=0;$("mTitle").textContent=s(sp.ten);$("mDesc").textContent=s(sp.mota);updateModalImg();renderThumbs();setModal(true); }

function renderResGrid(){
  var grid=$("resGrid"); if(!grid) return;
  grid.innerHTML="";
  if(!resItems.length){grid.innerHTML='<div class="empty-state"><h3>Chưa có tài nguyên</h3></div>';return;}
  var frag=document.createDocumentFragment();
  resItems.forEach(function(sp){
    var imgs=parseImgs(sp.anh),src=imgs[0]||"https://via.placeholder.com/900x600?text=No+Image";
    var card=document.createElement("article");card.className="res-card";
    card.innerHTML='<div class="res-card-img"><img src="'+src+'" alt="" loading="lazy"><div class="res-free-badge">✦ MIỄN PHÍ</div></div><div class="res-card-body"><div class="res-card-title">'+s(sp.ten)+'</div><div class="res-card-desc">'+s(sp.mota)+'</div>'+(sp.link?'<a href="'+s(sp.link)+'" target="_blank" rel="noopener" class="btn-download">Tải về miễn phí</a>':'')+'</div>';
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function parseRes(r){ return (Array.isArray(r)?r:[]).map(function(i){return {ten:s(i.ten||i[0]),mota:s(i.mota||i[1]),ngay:formatDate(s(i.ngay||i[2])),anh:s(i.anh||i[3]),link:s(i.link||i[4])};}).filter(function(x){return x.ten||x.anh;}); }

async function fetchItems(){
  var results=await Promise.allSettled([fetchJ(withTs(API_PPT)),fetchJ(withTs(API_POSTER))]);
  var pR=results[0], poR=results[1];
  var ppt=(pR.status==="fulfilled"?pR.value:[]).map(function(i){return parseItem(i,"powerpoint");}).filter(function(x){return x.ten||x.anh;});
  var post=(poR.status==="fulfilled"?poR.value:[]).map(function(i){return parseItem(i,"poster");}).filter(function(x){return x.ten||x.anh;});
  return {items:ppt.concat(post), complete:(pR.status==="fulfilled"&&poR.status==="fulfilled")};
}

async function load(){
  try{
    var r=await fetchItems();
    allItems=r.items;
    renderGrid();
  }catch(err){
    $("grid").innerHTML='<div class="empty-state"><h3>Không tải được dữ liệu</h3></div>';
  }
  await finishBoot();
}

function initTypeSwitch(){
  var sw = $("typeSwitch");
  if(!sw) return;
  
  function updateType(type){
    activeType = type;
    if(type === "poster"){
      sw.classList.add("poster-active");
    } else {
      sw.classList.remove("poster-active");
    }
    document.querySelectorAll(".type-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.type === type);
    });
    renderGrid();
  }

  document.querySelectorAll(".type-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      updateType(btn.dataset.type);
    });
  });

  // Hỗ trợ Kéo & Giữ (Drag/Swipe) với hiệu ứng Apple Liquid Glass
  var isDragging = false, startX = 0;
  sw.addEventListener("pointerdown", function(e){
    isDragging = true;
    startX = e.clientX;
    sw.setPointerCapture(e.pointerId);
  });
  sw.addEventListener("pointermove", function(e){
    if(!isDragging) return;
    var diff = e.clientX - startX;
    if(diff > 35 && activeType === "powerpoint"){
      updateType("poster");
      isDragging = false;
    } else if(diff < -35 && activeType === "poster"){
      updateType("powerpoint");
      isDragging = false;
    }
  });
  sw.addEventListener("pointerup", function(){ isDragging = false; });
  sw.addEventListener("pointercancel", function(){ isDragging = false; });
}

function bindEvents(){
  $("searchQ").addEventListener("input",debounce(renderGrid,180));
  $("btnReload").addEventListener("click",load);
  $("btnClose").addEventListener("click",function(){setModal(false);});
  $("modal").addEventListener("click",function(e){if(e.target.id==="modal") setModal(false);});
  $("btnNoticeDetail").addEventListener("click",function(){ var img=$("noticeImg");modalImgs=[img.dataset.full||img.src];modalIdx=0;$("mTitle").textContent="Thông báo mới nhất";$("mDesc").textContent="";updateModalImg();renderThumbs();setModal(true); });
  var yr=$("yr"); if(yr) yr.textContent=new Date().getFullYear();
}

var BOT_KB = [];
function botFindAnswer(text){
  return "Cảm ơn bạn đã nhắn tin! Bạn có thể xem các mẫu PowerPoint/Poster ở kho hoặc liên hệ Zalo 0773181186 để được hỗ trợ trực tiếp nhé! 😊";
}
function botAddMsg(text, who){
  var body = $("botBody"); if(!body) return;
  var div = document.createElement("div");
  div.className = "bot-msg " + (who==="user"?"user":"bot");
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function initBot(){
  var fab = $("botFab"), panel = $("botPanel"), close = $("botClose"), input = $("botInput"), send = $("botSend"), welcome = $("botWelcomeBubble"), welcomeClose = $("botWelcomeClose");
  if(!fab || !panel) return;
  var greeted = false;
  fab.addEventListener("click", function(){
    panel.classList.add("open");
    fab.classList.add("hidden");
    if(welcome) welcome.classList.add("hidden");
    if(!greeted){ greeted=true; botAddMsg("Xin chào! 😊 Mình là trợ lý ảo, mình có thể giúp gì cho bạn nè? ✨","bot"); }
    if(input) input.focus();
  });
  if(welcomeClose) welcomeClose.addEventListener("click", function(e){ e.stopPropagation(); if(welcome) welcome.classList.add("hidden"); });
  close.addEventListener("click", function(){ panel.classList.remove("open"); fab.classList.remove("hidden"); });
  function submitInput(){
    var v = s(input.value).trim();
    if(!v) return;
    input.value = "";
    botAddMsg(v, "user");
    setTimeout(function(){ botAddMsg(botFindAnswer(v), "bot"); }, 400);
  }
  if(send) send.addEventListener("click", submitInput);
  if(input) input.addEventListener("keydown", function(e){ if(e.key === "Enter") submitInput(); });
}

buildHTML();
initTypeSwitch();
bindEvents();
load();
(window.requestIdleCallback||function(f){setTimeout(f,800);})(function(){ initBot(); },{timeout:2000});

})();
</script>
