<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#060818">
<title>Nhân viên hỗ trợ — TP DESIGN PPTX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060818;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#f0f2ff;--muted:rgba(240,242,255,.55);--accent:#6d5bff;--accent2:#00d4ff;--good:#00e5a0;--warn:#ffb547;--danger:#ff4d6d}
html,body{height:100%}
body{background:radial-gradient(ellipse 70% 50% at 20% 0%,rgba(109,91,255,.18),transparent),var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--border);background:rgba(10,12,28,.9);flex-shrink:0}
header h1{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.danger{color:#ff8fa3;border-color:rgba(255,77,109,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sw{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.sw input{display:none}
.sw .t{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:.2s}
.sw .t::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.t{background:var(--good)}.sw input:checked+.t::after{left:19px}
.sw input:checked~.lbl{color:var(--good)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.show{display:flex}
/* login */
.login{margin:auto;width:min(380px,calc(100% - 32px));padding:28px;border-radius:24px;background:var(--surface);border:1px solid var(--border);text-align:center}
.login h2{font-size:18px;margin-bottom:8px}.login p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.login input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:#0c0e1f;color:var(--text);font:500 14px inherit;margin-bottom:12px;outline:none}
.err{color:#ff8fa3;font-size:12.5px;margin-top:10px;min-height:16px}
/* list */
.list{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:.15s}
.item:hover{border-color:rgba(109,91,255,.5);background:rgba(109,91,255,.08)}
.item.needs{border-color:rgba(255,77,109,.5)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.waiting{background:var(--warn)}.dot.fallback{background:var(--danger)}.dot.active{background:var(--good)}
.item .nm{font-size:13.5px;font-weight:700}.item .pv{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.item .meta{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);flex-shrink:0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.08);margin-bottom:3px}
.tag.q{background:rgba(255,181,71,.15);color:var(--warn)}.tag.n{background:rgba(255,77,109,.15);color:#ff8fa3}.tag.a{background:rgba(0,229,160,.15);color:var(--good)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;margin:auto;padding:40px 20px;line-height:1.7}
/* chat */
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-top .who{font-size:14px;font-weight:700}.chat-top .st{font-size:11.5px;color:var(--muted)}
.chat-top .sp{margin-left:auto;display:flex;gap:8px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;max-width:760px;width:100%;margin:0 auto}
.m{max-width:80%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m small{display:block;font-size:10.5px;font-weight:700;opacity:.65;margin-bottom:2px}
.m.user{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid var(--border);border-bottom-left-radius:4px}
.m.bot{align-self:flex-start;background:rgba(109,91,255,.12);border:1px dashed rgba(109,91,255,.4);border-bottom-left-radius:4px;color:rgba(240,242,255,.8)}
.m.staff{align-self:flex-end;background:linear-gradient(135deg,rgba(109,91,255,.9),rgba(0,212,255,.65));color:#fff;border-bottom-right-radius:4px}
.m.system{align-self:center;background:none;color:var(--muted);font-size:11.5px;text-align:center;max-width:94%}
.banner{margin:0 auto 4px;max-width:760px;width:calc(100% - 32px);padding:9px 14px;border-radius:12px;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.35);color:var(--warn);font-size:12.5px;font-weight:600;display:none}.banner.show{display:block}
.compose{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);flex-shrink:0;max-width:792px;width:100%;margin:0 auto}
.compose textarea{flex:1;resize:none;max-height:120px;padding:11px 14px;border-radius:16px;border:1px solid var(--border);background:#0c0e1f;color:var(--text);font:500 14px inherit;outline:none;line-height:1.4}
.compose textarea:focus{border-color:rgba(109,91,255,.7)}
.compose .btn{align-self:flex-end;padding:11px 20px}
@media(max-width:640px){.compose textarea{font-size:16px}.m{max-width:90%}}
</style>
</head>
<body>
<header>
  <button class="btn" id="btnBack" style="display:none">← Danh sách</button>
  <h1 id="hTitle">Nhân viên hỗ trợ — TP DESIGN PPTX</h1>
  <label class="sw" id="swWrap" style="display:none"><input type="checkbox" id="swOnline" checked><span class="t"></span><span class="lbl" id="swLbl">Trực tuyến</span></label>
</header>
<main>
  <section class="view" id="vLogin">
    <div class="login">
      <h2>🔐 Đăng nhập nhân viên</h2>
      <p>Nhập khóa nhân viên (ADMIN_KEY). Bạn chỉ cần nhập 1 lần trên thiết bị này.</p>
      <input type="password" id="keyInput" placeholder="Khóa nhân viên" autocomplete="current-password">
      <button class="btn pri" id="btnLogin" style="width:100%">Đăng nhập</button>
      <div class="err" id="loginErr"></div>
    </div>
  </section>
  <section class="view" id="vList"><div class="list" id="list"></div></section>
  <section class="view" id="vChat">
    <div class="chat-top"><div><div class="who" id="cName">Khách</div><div class="st" id="cStatus"></div></div>
      <div class="sp"><button class="btn pri" id="btnAccept" style="display:none">Nhận hỗ trợ</button><button class="btn danger" id="btnClose">Kết thúc</button></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="banner" id="banner"></div>
    <div class="compose"><textarea id="txt" rows="1" placeholder="Nhập tin nhắn trả lời… (Enter để gửi, Shift+Enter xuống dòng)" maxlength="600"></textarea><button class="btn pri" id="btnSend">Gửi</button></div>
  </section>
</main>
<script>
(function () {
"use strict";
var API_CHAT = "https://script.google.com/macros/s/AKfycbyCx_hJG5aijs6NK1LuNQ_yQJVPVYRCrKYwIDFmim0i7d6IRUkJwAtgfYAdL4YksB9n/exec";   /* cùng URL /exec với chatbot.js */
var $ = function (id) { return document.getElementById(id); };
var s = function (v) { return v == null ? "" : String(v); };

var params = new URLSearchParams(location.search);
var key = ""; try { key = localStorage.getItem("tp_staff_key") || ""; } catch (e) {}
if (params.get("k")) {                       /* nhận khóa từ link Gmail rồi xóa khỏi thanh địa chỉ */
  key = params.get("k"); try { localStorage.setItem("tp_staff_key", key); } catch (e) {}
  params.delete("k"); history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params.toString() : ""));
}
var curSid = params.get("sid") || "", since = 0, chatT = null, listT = null, pingT = null, wantOnline = true, curStatus = "", beeped = 0;
var chatBusy = false, chatAgain = false, chatGen = 0, seen = {}, pendingOpt = [], listBusy = false;

function api(payload) {
  payload.k = key;
  return fetch(API_CHAT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.error === "unauthorized") { var e = new Error("unauthorized"); e.auth = true; throw e; } return d; });
}
function show(v) { ["vLogin", "vList", "vChat"].forEach(function (id) { $(id).classList.toggle("show", id === v); });
  $("btnBack").style.display = v === "vChat" ? "" : "none"; $("swWrap").style.display = v === "vLogin" ? "none" : ""; }
function ago(t) { var d = Math.max(0, Date.now() - t) / 1000; if (d < 60) return "vừa xong"; if (d < 3600) return Math.floor(d / 60) + " phút trước"; return Math.floor(d / 3600) + " giờ trước"; }
function beep() { try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); setTimeout(function () { o.stop(); c.close(); }, 180); } catch (e) {} }
function needLogin(msg) { stopAll(); show("vLogin"); $("loginErr").textContent = msg || ""; }
function stopAll() { clearTimeout(chatT); clearTimeout(listT); clearInterval(pingT); }

/* ---------- Hiện diện (online/offline) ---------- */
function startPing() {
  clearInterval(pingT);
  var go = function () { if (wantOnline) api({ action: "sPing" }).catch(function (e) { if (e.auth) needLogin("Khóa không đúng"); }); };
  go(); pingT = setInterval(go, 20000);
}
$("swOnline").addEventListener("change", function () {
  wantOnline = this.checked; $("swLbl").textContent = wantOnline ? "Trực tuyến" : "Ngoại tuyến";
  if (wantOnline) startPing(); else { clearInterval(pingT); api({ action: "sOffline" }).catch(function () {}); }
});
window.addEventListener("pagehide", function () {          /* đóng tab -> báo offline ngay */
  if (!key) return;
  try { navigator.sendBeacon(API_CHAT, JSON.stringify({ action: "sOffline", k: key })); } catch (e) {}
});

/* ---------- Danh sách ---------- */
function openList() {
  curSid = ""; clearTimeout(chatT); show("vList"); $("hTitle").textContent = "Hàng đợi hỗ trợ";
  history.replaceState(null, "", location.pathname);
  loadList();
}
async function loadList() {
  if (listBusy) return;
  listBusy = true; clearTimeout(listT);
  try {
    var r = await api({ action: "sList" });
    var box = $("list"); box.innerHTML = "";
    var arr = r.sessions || [];
    if (!arr.length) box.innerHTML = '<div class="empty">Chưa có phiên chat nào.<br>Khi khách yêu cầu gặp nhân viên, phiên sẽ hiện ở đây.</div>';
    arr.forEach(function (x) {
      var it = document.createElement("div"); it.className = "item" + (x.needs ? " needs" : "");
      var lab = x.status === "active" ? '<span class="tag a">Đang chat</span>' : x.queue ? '<span class="tag q">Hàng đợi #' + x.queue + '</span>' : x.status === "closed" ? '<span class="tag">Đã kết thúc</span>' : '<span class="tag">Chỉ chat với bot</span>';
      it.innerHTML = '<span class="dot ' + x.status + '"></span><div style="min-width:0"><div class="nm"></div><div class="pv"></div></div><div class="meta">' + lab + (x.needs ? '<br><span class="tag n">Cần trả lời</span>' : "") + '<br>' + ago(x.lastSeen) + '</div>';
      it.querySelector(".nm").textContent = x.name;
      it.querySelector(".pv").textContent = x.last ? (x.last.from === "user" ? "Khách: " : x.last.from === "staff" ? "Bạn: " : "") + x.last.text : "";
      it.addEventListener("click", function () { openChat(x.sid); });
      box.appendChild(it);
    });
    var n = arr.filter(function (x) { return x.needs; }).length;
    document.title = (n ? "(" + n + ") " : "") + "Nhân viên hỗ trợ — TP DESIGN PPTX";
    if (n > beeped && wantOnline) beep(); beeped = n;
  } catch (e) { listBusy = false; if (e.auth) return needLogin("Khóa không đúng"); }
  listBusy = false;
  if ($("vList").classList.contains("show")) listT = setTimeout(loadList, 4000);
}

/* ---------- Khung chat ---------- */
function bubble(m) {
  var d = document.createElement("div"); d.className = "m " + m.from;
  if (m.from === "user") { var a = document.createElement("small"); a.textContent = "Khách"; d.appendChild(a); }
  if (m.from === "bot") { var b = document.createElement("small"); b.textContent = "🤖 Trợ lý AI"; d.appendChild(b); }
  d.appendChild(document.createTextNode(s(m.text)));
  return d;
}
function openChat(sid) {
  curSid = sid; since = 0; curStatus = ""; seen = {}; pendingOpt = []; chatGen++;
  $("msgs").innerHTML = ""; $("cName").textContent = "Đang tải…"; $("cStatus").textContent = "";
  $("hTitle").textContent = "Khung chat hỗ trợ"; show("vChat");
  history.replaceState(null, "", location.pathname + "?sid=" + encodeURIComponent(sid));
  pollChat(true);
}
/* Thêm tin vào khung chat; bỏ qua tin đã hiện (theo số thứ tự từ server) để không bị trùng */
function applyMsgs(list) {
  var box = $("msgs"), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120, gotUser = false;
  (list || []).forEach(function (m) {
    if (m.i != null) { if (seen[m.i]) return; seen[m.i] = 1; }
    if (m.from === "staff" && pendingOpt.length) { var o = pendingOpt.shift(); if (o.parentNode) o.parentNode.removeChild(o); }   /* thay bong bóng tạm bằng tin thật */
    box.appendChild(bubble(m));
    if (m.from === "user") gotUser = true;
  });
  return { near: near, gotUser: gotUser };
}
function removeOpt(o) { var i = pendingOpt.indexOf(o); if (i >= 0) pendingOpt.splice(i, 1); if (o.parentNode) o.parentNode.removeChild(o); }
function pollNow() { clearTimeout(chatT); pollChat(false); }
/* Chỉ một yêu cầu hỏi tin mới chạy tại một thời điểm */
async function pollChat(first) {
  if (!curSid) return;
  if (chatBusy) { chatAgain = true; return; }
  chatBusy = true; clearTimeout(chatT);
  var g = chatGen;
  try {
    var r = await api({ action: "sGet", sid: curSid, since: since });
    if (g !== chatGen) return;                                  /* đã chuyển sang phiên khác */
    if (!r.ok) { $("cName").textContent = "Không mở được phiên"; $("cStatus").textContent = r.error || ""; return; }
    var a = applyMsgs(r.msgs), box = $("msgs");
    since = Math.max(since, r.last || 0);
    if (first || a.near) box.scrollTop = box.scrollHeight;
    if (a.gotUser && !first) beep();
    $("cName").textContent = r.name; curStatus = r.status;
    var map = { active: "Đang trò chuyện với bạn", waiting: "Khách đang chờ kết nối" + (r.queue ? " · hàng đợi #" + r.queue : ""), fallback: "Trợ lý AI đang hỗ trợ tạm · hàng đợi #" + (r.queue || 1), bot: "Khách mới chat với bot", closed: "Đã kết thúc" };
    $("cStatus").textContent = (map[r.status] || r.status) + " · khách hoạt động " + ago(r.lastSeen);
    $("btnAccept").style.display = (r.status === "waiting" || r.status === "fallback") ? "" : "none";
    var bn = $("banner");
    if (r.status === "fallback" || r.status === "waiting") { bn.textContent = "Khách đang được trợ lý AI hỗ trợ tạm. Bấm \"Nhận hỗ trợ\" hoặc gửi tin nhắn để tiếp quản cuộc trò chuyện."; bn.classList.add("show"); }
    else if (r.status === "closed") { bn.textContent = "Cuộc trò chuyện đã kết thúc."; bn.classList.add("show"); }
    else bn.classList.remove("show");
  } catch (e) { if (e.auth) return needLogin("Khóa không đúng"); }
  finally {
    chatBusy = false;
    if (chatAgain) { chatAgain = false; setTimeout(function () { pollChat(false); }, 0); }
  }
  /* khi đang trò chuyện hỏi nhanh hơn, khi tab ẩn hỏi chậm lại */
  chatT = setTimeout(pollChat, document.hidden ? 5000 : (curStatus === "active" ? 1500 : 2500));
}
async function send() {
  var t = $("txt"), v = t.value.trim(); if (!v || !curSid) return;
  t.value = ""; t.style.height = "auto";
  /* hiện ngay tin của bạn (mờ) trong lúc chờ máy chủ xác nhận */
  var box = $("msgs"), opt = bubble({ from: "staff", text: v });
  opt.style.opacity = ".6"; box.appendChild(opt); box.scrollTop = box.scrollHeight; pendingOpt.push(opt);
  try {
    var r = await api({ action: "sSend", sid: curSid, text: v, since: since });
    if (!r.ok) { removeOpt(opt); alert(r.error || "Gửi thất bại"); t.value = v; return; }
    if (r.msgs) {                                               /* backend mới trả luôn tin mới: hiện ngay */
      applyMsgs(r.msgs); since = Math.max(since, r.last || 0); removeOpt(opt); box.scrollTop = box.scrollHeight;
    } else pollNow();                                           /* backend cũ: hỏi tin mới ngay */
  } catch (e) { removeOpt(opt); if (e.auth) needLogin("Khóa không đúng"); else { alert("Không gửi được, thử lại nhé."); t.value = v; } }
  finally { t.focus(); }
}
$("btnSend").addEventListener("click", send);
$("txt").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("txt").addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px"; });
$("btnAccept").addEventListener("click", async function () {
  try { await api({ action: "sAccept", sid: curSid }); pollNow(); } catch (e) { if (e.auth) needLogin("Khóa không đúng"); }
});
$("btnClose").addEventListener("click", async function () {
  if (!confirm("Kết thúc cuộc trò chuyện? Khách sẽ quay lại chat với trợ lý AI.")) return;
  try { await api({ action: "sClose", sid: curSid }); pollNow(); } catch (e) { if (e.auth) needLogin("Khóa không đúng"); }
});
$("btnBack").addEventListener("click", openList);

/* ---------- Đăng nhập ---------- */
$("btnLogin").addEventListener("click", async function () {
  var v = $("keyInput").value.trim(); if (!v) return;
  key = v; $("loginErr").textContent = "Đang kiểm tra…";
  try {
    var r = await api({ action: "sPing" });
    if (r && r.ok) { try { localStorage.setItem("tp_staff_key", key); } catch (e) {} boot(); }
    else $("loginErr").textContent = "Không đăng nhập được.";
  } catch (e) { $("loginErr").textContent = e.auth ? "Khóa không đúng." : "Không kết nối được máy chủ."; }
});
$("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btnLogin").click(); });

function boot() {
  startPing();
  if (curSid) openChat(curSid); else openList();
}
if (!API_CHAT || API_CHAT.indexOf("PASTE_") === 0) { show("vLogin"); $("loginErr").textContent = "Chưa cấu hình API_CHAT trong staff.html"; }
else if (!key) show("vLogin");
else boot();
})();
</script>
</body>
</html>
